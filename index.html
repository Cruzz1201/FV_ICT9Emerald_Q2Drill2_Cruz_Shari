<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css " rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>    

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">

    <title>Drill 2</title>

    <style>
        body{
            background-image: url('https://i.pinimg.com/originals/b2/f0/a0/b2f0a012e81c28c3730e6e7e11f59a70.gif');
            background-repeat: no-repeat;
            background-size: cover;
            margin-top: 15px;
            align-items: center;
            font-family: "Trirong", serif;
            color: white;
            

        }

        #footer{
        position: fixed;
        bottom: 0;
        left: 0;
        height: 25px;
        width: 100%;
        text-align: center;
        background-color: rgba(88, 77, 61, 0.728);
        color: white;
        }
    </style>

</head>
<body>
    <div class="container" style="text-align: center;">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQTFXIrDjd53NN3bqXSjcgcZ80PI6Q-rYKw8tfpOe0Sca3Ji_yeLIYDuXK8&s=10" alt="logo for club" width="80px" height="80px" style="border-radius: 50px;">
        <br>
        <h1 style="color: rgb(239, 224, 210); text-shadow: 3px 3px 3px #523417;"><b>Welcome to the Home Maker's Club!</b></h1>
        <h4 style="color: rgb(234, 230, 224); text-shadow: 4px 4px 4px #3e2101;"><n>Add New Members</b></h4>

        <p style="color: rgb(71, 49, 20)"><i><b>Enter your full name.</b></i></p>

    </div>

    <div class="container" style="background-color: rgba(99, 89, 70, 0.678); border-radius: 10px; margin-top: 25px; width: 360px; height: 230px; padding-left: 20px; padding-right: 20px; padding-top: 5px;">

        <div class="col" style="color: White;">
            <div class="row">
                <label for="fname"><b>First Name</b></label>
                <br>
                <input id="fname" name="fname" type="text" style="width: 350px;" placeholder="Enter first name..." class="form-control" required>
            </div>

            <br>

            <div class="row">
                <label for="lname"><b>Last Name</b></label>
                <br>
                <input id="lname" name="lname" type="text" style="width: 350px;" placeholder="Enter last name..." class="form-control" required>
            </div>

            <br>

            <div class="row" id="buttons" style="align-items: center;">

                <button type="button" py-click="new_members" style="background-color: rgba(247, 243, 232, 0.61); color: rgb(115, 86, 43); width:150px; text-align: center; border-radius: 5px; border: inset; margin-left: 10px;">Enter</button>


                <button type="reset" style="background-color:rgba(247, 243, 232, 0.61); color: rgb(115, 86, 43); width:150px; text-align: center; border-radius: 5px; border: inset; margin-left: 10px;" onclick="window.location.reload()">Clear</button>

            </div>

        </div>

    </div>

    <center>

    <div id="new_members" style="background-color: rgba(187, 165, 126, 0.678); border-radius: 10px; margin-top: 25px; width: 360px; height: auto; padding-left: 20px; padding-right: 20px; padding-top: 5px; padding-bottom: 5px;">

        <div class="row">
            <p style="color: rgb(253, 251, 251); font-size: large; text-align: center;"><b>Master list will appear here...</b></p>

            <script type= "py" src="main.py"></script>
                
        </div>

    </div>

    </center>

    <br>

    <div id="footer">
        <p> ©2026 Drill 1 | Created by Shari Cruz, 10 - Emerald | Quarter 2 </p>
    </div>


</body>
</html>
